<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisPrime — Secure Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@200;300;400;500;600&display=swap');

  :root {
    --navy: #050d1a;
    --royal: #0a1f3d;
    --blue: #0f3460;
    --cyan: #00d4ff;
    --cyan-dim: #0099bb;
    --silver: #a8c0d6;
    --white: #e8f4fd;
    --purple: #7b6ef6;
    --glass-bg: rgba(8, 25, 58, 0.55);
    --glass-border: rgba(0, 212, 255, 0.18);
    --glow-cyan: 0 0 20px rgba(0,212,255,0.4), 0 0 60px rgba(0,212,255,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: default;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  #canvas-container canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* Subtle vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(5,13,26,0.7) 100%);
    pointer-events: none;
  }

  /* Grid overlay */
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Main content */
  .portal-wrapper {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
  }

  /* Branding top */
  .brand-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-hex {
    width: 42px;
    height: 42px;
    position: relative;
  }

  .logo-hex svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 8px var(--cyan));
  }

  .brand-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--white);
    text-transform: uppercase;
  }

  .brand-name span {
    color: var(--cyan);
  }

  .security-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--silver);
    text-transform: uppercase;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  /* Bottom indicators */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
    border-top: 1px solid rgba(0,212,255,0.06);
  }

  .bottom-info {
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(168,192,214,0.4);
    text-transform: uppercase;
  }

  .encryption-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: rgba(0,212,255,0.5);
    text-transform: uppercase;
  }

  /* Login card */
  .login-card {
    pointer-events: all;
    width: 100%;
    max-width: 440px;
    position: relative;
    animation: card-appear 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(30px);
  }

  @keyframes card-appear {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Glowing outer ring */
  .card-glow-ring {
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: linear-gradient(135deg,
      rgba(0,212,255,0.5),
      rgba(123,110,246,0.3),
      rgba(0,212,255,0.1),
      rgba(123,110,246,0.4)
    );
    background-size: 300% 300%;
    animation: border-rotate 6s linear infinite;
    z-index: -1;
    filter: blur(1px);
  }

  @keyframes border-rotate {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card-inner {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 44px 40px 36px;
    position: relative;
    overflow: hidden;
  }

  /* Sheen sweep animation */
  .card-sheen {
    position: absolute;
    top: -50%;
    left: -75%;
    width: 50%;
    height: 200%;
    background: linear-gradient(
      105deg,
      transparent 0%,
      rgba(255,255,255,0.03) 40%,
      rgba(0,212,255,0.07) 50%,
      rgba(255,255,255,0.03) 60%,
      transparent 100%
    );
    transform: skewX(-20deg);
    animation: sheen 8s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes sheen {
    0%, 100% { left: -75%; opacity: 0; }
    10% { opacity: 1; }
    50% { left: 125%; opacity: 0.8; }
    60% { opacity: 0; }
  }

  /* Corner accents */
  .corner-accent {
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 2;
  }
  .ca-tl { top: 12px; left: 12px; border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan); border-radius: 2px 0 0 0; }
  .ca-tr { top: 12px; right: 12px; border-top: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan); border-radius: 0 2px 0 0; }
  .ca-bl { bottom: 12px; left: 12px; border-bottom: 1.5px solid rgba(0,212,255,0.4); border-left: 1.5px solid rgba(0,212,255,0.4); border-radius: 0 0 0 2px; }
  .ca-br { bottom: 12px; right: 12px; border-bottom: 1.5px solid rgba(0,212,255,0.4); border-right: 1.5px solid rgba(0,212,255,0.4); border-radius: 0 0 2px 0; }

  /* Card header */
  .card-header {
    text-align: center;
    margin-bottom: 34px;
    position: relative;
    z-index: 3;
  }

  .shield-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    position: relative;
  }

  .shield-icon svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 12px rgba(0,212,255,0.6));
    animation: shield-pulse 3s ease-in-out infinite;
  }

  @keyframes shield-pulse {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(0,212,255,0.6)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 22px rgba(0,212,255,0.9)); transform: scale(1.04); }
  }

  .portal-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--white);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .portal-subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--cyan);
    text-transform: uppercase;
    font-weight: 400;
    opacity: 0.8;
  }

  /* Divider */
  .card-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
    margin-bottom: 28px;
  }

  /* Form */
  .form-group {
    position: relative;
    margin-bottom: 20px;
    z-index: 3;
  }

  .form-input {
    width: 100%;
    background: rgba(5,20,50,0.6);
    border: 1px solid rgba(0,212,255,0.15);
    border-radius: 10px;
    padding: 16px 16px 8px;
    padding-top: 22px;
    color: var(--white);
    font-family: 'Exo 2', sans-serif;
    font-size: 14px;
    font-weight: 400;
    outline: none;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .form-input:focus {
    border-color: var(--cyan);
    background: rgba(0,30,70,0.7);
    box-shadow: var(--glow-cyan), inset 0 0 20px rgba(0,212,255,0.04);
  }

  .form-input.filled,
  .form-input:focus {
    border-color: rgba(0,212,255,0.35);
  }

  .form-label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--silver);
    opacity: 0.6;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    letter-spacing: 1px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
  }

  .form-input:focus + .form-label,
  .form-input.filled + .form-label {
    top: 10px;
    transform: none;
    font-size: 9px;
    color: var(--cyan);
    opacity: 1;
    letter-spacing: 2px;
  }

  /* Input icon */
  .input-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(0,212,255,0.4);
    pointer-events: none;
    transition: color 0.3s;
  }

  .form-input:focus ~ .input-icon {
    color: var(--cyan);
  }

  .toggle-pw {
    pointer-events: all;
    cursor: pointer;
  }

  /* Input bar animation */
  .input-bar {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 0 0 10px 10px;
    transform: translateX(-50%);
    transition: width 0.4s ease;
  }

  .form-input:focus ~ .input-bar {
    width: calc(100% - 2px);
  }

  /* Options row */
  .options-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    position: relative;
    z-index: 3;
  }

  .remember-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 12px;
    color: var(--silver);
    opacity: 0.7;
    letter-spacing: 0.5px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    user-select: none;
  }

  .custom-checkbox {
    width: 16px;
    height: 16px;
    border: 1.5px solid rgba(0,212,255,0.3);
    border-radius: 4px;
    background: transparent;
    position: relative;
    transition: all 0.25s;
    flex-shrink: 0;
  }

  .remember-label input:checked + .custom-checkbox {
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,212,255,0.4);
  }

  .remember-label input:checked + .custom-checkbox::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 4.5px;
    width: 4px;
    height: 7px;
    border: 1.5px solid #050d1a;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }

  .remember-label input {
    display: none;
  }

  .forgot-link {
    font-size: 11px;
    color: var(--cyan);
    opacity: 0.7;
    text-decoration: none;
    letter-spacing: 1.5px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    transition: opacity 0.2s;
  }
  .forgot-link:hover { opacity: 1; }

  /* Buttons */
  .btn-primary {
    width: 100%;
    position: relative;
    padding: 16px;
    border: none;
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s ease;
    z-index: 3;
    background: linear-gradient(135deg, #0066cc, #00aadd, #0066cc);
    background-size: 200% 100%;
    color: #e8f4fd;
    margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,100,200,0.35), 0 0 40px rgba(0,212,255,0.1);
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.12) 50%, transparent 65%);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }

  .btn-primary:hover {
    background-position: 100% 0;
    box-shadow: 0 6px 30px rgba(0,150,255,0.5), 0 0 60px rgba(0,212,255,0.2);
    transform: translateY(-1px);
  }

  .btn-primary:hover::before {
    transform: translateX(100%);
  }

  .btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 10px rgba(0,100,200,0.3);
  }

  .btn-primary.loading {
    pointer-events: none;
  }

  .btn-loading-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: linear-gradient(90deg, var(--cyan), var(--purple), var(--cyan));
    background-size: 200% 100%;
    animation: none;
    border-radius: 0 0 10px 10px;
  }

  .btn-primary.loading .btn-loading-bar {
    animation: loading-progress 1.5s ease forwards, shimmer 1.5s linear infinite;
    width: 100%;
  }

  @keyframes loading-progress {
    0% { width: 0; opacity: 1; }
    85% { width: 100%; opacity: 1; }
    100% { width: 100%; opacity: 0; }
  }

  @keyframes shimmer {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  .btn-secondary {
    width: 100%;
    position: relative;
    padding: 13px;
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s ease;
    z-index: 3;
    background: rgba(0,30,70,0.4);
    border: 1px solid rgba(0,212,255,0.2);
    color: var(--silver);
    margin-bottom: 10px;
  }

  .btn-secondary:hover {
    border-color: rgba(0,212,255,0.5);
    color: var(--white);
    background: rgba(0,50,100,0.4);
    box-shadow: 0 0 20px rgba(0,212,255,0.1);
  }

  .btn-biometric {
    border-color: rgba(123,110,246,0.25);
    color: rgba(168,192,214,0.7);
  }

  .btn-biometric:hover {
    border-color: rgba(123,110,246,0.5);
    color: var(--white);
    background: rgba(40,20,80,0.4);
    box-shadow: 0 0 20px rgba(123,110,246,0.1);
  }

  .btn-icon {
    display: inline-block;
    margin-right: 8px;
    vertical-align: middle;
    opacity: 0.7;
  }

  /* Security badge */
  .security-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(0,212,255,0.07);
    position: relative;
    z-index: 3;
  }

  .sec-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: rgba(168,192,214,0.35);
    text-transform: uppercase;
  }

  .sec-badge svg {
    opacity: 0.4;
  }

  .sec-separator {
    width: 1px;
    height: 12px;
    background: rgba(0,212,255,0.12);
  }

  /* Success overlay */
  .success-overlay {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: rgba(5,13,26,0.9);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .success-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .success-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(0,212,255,0.4);
    animation: ring-expand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transform: scale(0);
  }

  @keyframes ring-expand {
    to { transform: scale(1); }
  }

  .success-check {
    color: var(--cyan);
  }

  .success-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    letter-spacing: 4px;
    color: var(--white);
    text-transform: uppercase;
    font-weight: 600;
  }

  .success-sub {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(168,192,214,0.6);
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Scan line */
  .scan-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.7), transparent);
    top: -100%;
    opacity: 0;
    z-index: 51;
  }

  .scan-line.active {
    animation: scan 1.2s ease-in-out forwards;
    opacity: 1;
  }

  @keyframes scan {
    0% { top: -2px; opacity: 0.8; }
    100% { top: 100%; opacity: 0; }
  }

  /* Ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    transform: scale(0);
    animation: ripple-anim 0.6s linear;
    background: rgba(0,212,255,0.25);
    pointer-events: none;
  }

  @keyframes ripple-anim {
    to { transform: scale(4); opacity: 0; }
  }

  /* Floating particles on card */
  .card-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0;
    animation: float-particle 6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes float-particle {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.3; }
    100% { transform: translateY(-80px) translateX(var(--dx, 20px)); opacity: 0; }
  }

  /* Scrollable on mobile */
  @media (max-height: 700px) {
    .portal-wrapper {
      overflow-y: auto;
      align-items: flex-start;
      padding: 80px 20px 60px;
    }
    body { overflow-y: auto; }
  }

  @media (max-width: 480px) {
    .card-inner { padding: 32px 24px 28px; }
    .brand-header { padding: 16px 20px; }
    .brand-name { font-size: 17px; }
    .bottom-bar { padding: 12px 20px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div class="vignette"></div>
<div class="grid-overlay"></div>

<!-- Brand Header -->
<header class="brand-header">
 
  <div class="security-status">
    <div class="status-dot"></div>
    <span>SECURE CONNECTION ACTIVE</span>
  </div>
</header>

<!-- Main Portal -->
<main class="portal-wrapper" role="main">
  <div class="login-card" id="loginCard">
    <div class="card-glow-ring"></div>
   
  </div>
</main>

<!-- Bottom Bar -->
<footer class="bottom-bar">
  <span class="bottom-info">© 2026 Corp.</span>
  <div class="encryption-badge">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L4 7v5c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V7l-8-5z"/>
    </svg>
    256-bit TLS Encrypted
  </div>
</footer>

<script>
// ──────────────────────────────────────────────
// THREE.JS BACKGROUND SCENE
// ──────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 18);

// Mouse tracking
const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
document.addEventListener('mousemove', e => {
  mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.targetY = -(e.clientY / window.innerHeight - 0.5) * 2;
});

// ── LIGHTS ──
const ambientLight = new THREE.AmbientLight(0x050d1a, 3);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x0066aa, 2);
dirLight.position.set(10, 10, 5);
scene.add(dirLight);

const cyanLight = new THREE.PointLight(0x00d4ff, 4, 30);
cyanLight.position.set(-5, 3, 5);
scene.add(cyanLight);

const purpleLight = new THREE.PointLight(0x7b6ef6, 3, 25);
purpleLight.position.set(5, -3, 4);
scene.add(purpleLight);

const backLight = new THREE.PointLight(0x003366, 2, 40);
backLight.position.set(0, 0, -15);
scene.add(backLight);

// ── CENTRAL SHIELD ──
const shieldGroup = new THREE.Group();
scene.add(shieldGroup);

// Main shield body (octahedron base)
const shieldGeo = new THREE.OctahedronGeometry(3.5, 2);
const shieldMat = new THREE.MeshPhongMaterial({
  color: 0x001133,
  emissive: 0x001844,
  transparent: true,
  opacity: 0.25,
  wireframe: false,
  shininess: 100,
});
const shield = new THREE.Mesh(shieldGeo, shieldMat);
shieldGroup.add(shield);

// Shield wireframe
const wireGeo = new THREE.OctahedronGeometry(3.52, 2);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x00d4ff,
  wireframe: true,
  transparent: true,
  opacity: 0.12,
});
const shieldWire = new THREE.Mesh(wireGeo, wireMat);
shieldGroup.add(shieldWire);

// Inner core sphere
const coreGeo = new THREE.SphereGeometry(1.2, 32, 32);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0x002255,
  emissive: 0x0044aa,
  transparent: true,
  opacity: 0.6,
  shininess: 200,
});
const core = new THREE.Mesh(coreGeo, coreMat);
shieldGroup.add(core);

// Core inner glow
const glowGeo = new THREE.SphereGeometry(0.9, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x00d4ff,
  transparent: true,
  opacity: 0.15,
});
const coreGlow = new THREE.Mesh(glowGeo, glowMat);
shieldGroup.add(coreGlow);

// ── ORBITING RINGS ──
function createRing(radius, tube, color, opacity, tiltX, tiltZ) {
  const geo = new THREE.TorusGeometry(radius, tube, 6, 80);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity });
  const ring = new THREE.Mesh(geo, mat);
  ring.rotation.x = tiltX;
  ring.rotation.z = tiltZ;
  return ring;
}

const ring1 = createRing(5.5, 0.018, 0x00d4ff, 0.45, Math.PI/2.5, 0.4);
const ring2 = createRing(6.8, 0.015, 0x7b6ef6, 0.3, Math.PI/3, -0.6);
const ring3 = createRing(8.2, 0.012, 0x00aacc, 0.2, Math.PI/4, 0.8);
const ring4 = createRing(4.2, 0.022, 0x0088bb, 0.35, 0.2, Math.PI/5);
shieldGroup.add(ring1, ring2, ring3, ring4);

// ── POLICY NODES ──
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);
const nodePositions = [];

for (let i = 0; i < 18; i++) {
  const theta = (i / 18) * Math.PI * 2;
  const phi = Math.acos(1 - 2 * (i / 18));
  const r = 9 + Math.sin(i * 1.7) * 2;
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta) * 0.6;
  const z = r * Math.cos(phi) * 0.5 - 2;

  const size = 0.06 + Math.random() * 0.08;
  const geo = Math.random() > 0.5
    ? new THREE.OctahedronGeometry(size, 0)
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: Math.random() > 0.6 ? 0x00d4ff : 0x7b6ef6,
    transparent: true,
    opacity: 0.6 + Math.random() * 0.3,
  });
  const node = new THREE.Mesh(geo, mat);
  node.position.set(x, y, z);
  nodePositions.push({ x, y, z, baseY: y, speed: 0.3 + Math.random() * 0.7, phase: Math.random() * Math.PI * 2 });
  nodeGroup.add(node);
}

// ── CONNECTION LINES ──
const lineGroup = new THREE.Group();
scene.add(lineGroup);

function createLine(p1, p2, color, opacity) {
  const points = [new THREE.Vector3(p1.x, p1.y, p1.z), new THREE.Vector3(p2.x, p2.y, p2.z)];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  return new THREE.Line(geo, mat);
}

// Connect close nodes
for (let i = 0; i < nodePositions.length; i++) {
  for (let j = i + 1; j < nodePositions.length; j++) {
    const dx = nodePositions[i].x - nodePositions[j].x;
    const dy = nodePositions[i].y - nodePositions[j].y;
    const dz = nodePositions[i].z - nodePositions[j].z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist < 8) {
      const line = createLine(nodePositions[i], nodePositions[j], 0x003366, 0.18);
      lineGroup.add(line);
    }
  }
}

// ── PARTICLE GALAXY ──
const particleCount = 1200;
const positions = new Float32Array(particleCount * 3);
const particleSpeeds = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 2 - 1);
  const r = 10 + Math.random() * 20;
  positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
  positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.5;
  positions[i * 3 + 2] = r * Math.cos(phi) - 5;
  particleSpeeds[i] = 0.2 + Math.random() * 0.8;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: 0x00a8cc,
  size: 0.06,
  transparent: true,
  opacity: 0.55,
  sizeAttenuation: true,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Accent particles
const accentPositions = new Float32Array(300 * 3);
for (let i = 0; i < 300; i++) {
  accentPositions[i * 3] = (Math.random() - 0.5) * 40;
  accentPositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
  accentPositions[i * 3 + 2] = (Math.random() - 0.5) * 30 - 5;
}
const accentGeo = new THREE.BufferGeometry();
accentGeo.setAttribute('position', new THREE.BufferAttribute(accentPositions, 3));
const accentMat = new THREE.PointsMaterial({ color: 0x7b6ef6, size: 0.1, transparent: true, opacity: 0.35 });
const accentParticles = new THREE.Points(accentGeo, accentMat);
scene.add(accentParticles);

// ── BACKGROUND GRID ──
const gridHelper = new THREE.GridHelper(60, 30, 0x001133, 0x000d22);
gridHelper.position.y = -12;
gridHelper.rotation.x = 0.15;
scene.add(gridHelper);

// ── FLOATING GEOMETRIC STRUCTURES ──
function createFloater(geoType, size, color, x, y, z) {
  let geo;
  switch(geoType) {
    case 0: geo = new THREE.IcosahedronGeometry(size, 0); break;
    case 1: geo = new THREE.OctahedronGeometry(size, 0); break;
    case 2: geo = new THREE.TetrahedronGeometry(size, 0); break;
    default: geo = new THREE.BoxGeometry(size, size, size);
  }
  const mat = new THREE.MeshPhongMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.2,
    transparent: true,
    opacity: 0.2,
    wireframe: Math.random() > 0.5,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  return mesh;
}

const floaters = [];
const floaterData = [
  [0, 0.6, 0x00d4ff, -12, 4, -3],
  [1, 0.4, 0x7b6ef6, 13, -2, -2],
  [2, 0.5, 0x00aadd, 10, 6, -6],
  [0, 0.35, 0x5599ff, -10, -4, -4],
  [1, 0.55, 0x00d4ff, 14, 2, -8],
  [2, 0.3, 0x7b6ef6, -14, 3, -7],
];

floaterData.forEach(([t, s, c, x, y, z]) => {
  const f = createFloater(t, s, c, x, y, z);
  floaters.push({ mesh: f, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.6 });
  scene.add(f);
});

// ── ENERGY PULSE RING ──
const pulseGeo = new THREE.RingGeometry(0.5, 0.52, 64);
const pulseMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
const pulseRing = new THREE.Mesh(pulseGeo, pulseMat);
pulseRing.rotation.x = Math.PI / 2;
shieldGroup.add(pulseRing);

// ── ANIMATION STATE ──
let t = 0;
let loginTriggered = false;

// ── RENDER LOOP ──
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;

  // Mouse interpolation
  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;

  // Camera cinematic motion
  camera.position.x = mouse.x * 2 + Math.sin(t * 0.3) * 0.5;
  camera.position.y = mouse.y * 1.5 + Math.cos(t * 0.2) * 0.3;
  camera.lookAt(0, 0, 0);

  // Shield rotation
  shieldGroup.rotation.y = t * 0.15 + mouse.x * 0.3;
  shieldGroup.rotation.x = Math.sin(t * 0.2) * 0.08 + mouse.y * 0.15;

  // Ring orbits
  ring1.rotation.z = t * 0.4;
  ring2.rotation.z = -t * 0.25;
  ring3.rotation.y = t * 0.18;
  ring4.rotation.x = t * 0.3;

  // Core pulse
  const corePulse = 1 + Math.sin(t * 2) * 0.08;
  core.scale.setScalar(corePulse);
  coreGlow.scale.setScalar(corePulse * (1 + Math.sin(t * 3) * 0.05));

  // Energy pulse ring expansion
  const pulseScale = 1 + (t % 3) * 1.5;
  pulseRing.scale.setScalar(pulseScale);
  pulseMat.opacity = Math.max(0, 0.6 - (t % 3) * 0.2);

  // Animated lights
  cyanLight.position.x = Math.sin(t * 0.5) * 8;
  cyanLight.position.y = Math.cos(t * 0.4) * 6;
  cyanLight.intensity = 3 + Math.sin(t * 1.5) * 1;

  purpleLight.position.x = Math.cos(t * 0.4) * 8;
  purpleLight.position.y = Math.sin(t * 0.5) * 5;

  // Nodes floating
  const nodeChildren = nodeGroup.children;
  for (let i = 0; i < nodePositions.length; i++) {
    const p = nodePositions[i];
    nodeChildren[i].position.y = p.baseY + Math.sin(t * p.speed + p.phase) * 0.5;
    nodeChildren[i].rotation.y = t * p.speed;
  }

  // Particle rotation
  particles.rotation.y = t * 0.04;
  particles.rotation.x = t * 0.015;
  accentParticles.rotation.y = -t * 0.03;

  // Floaters
  floaters.forEach(({ mesh, phase, speed }) => {
    mesh.rotation.x = t * speed * 0.5;
    mesh.rotation.y = t * speed * 0.3;
    mesh.position.y += Math.sin(t * speed + phase) * 0.003;
  });

  // Grid subtle drift
  gridHelper.position.z = Math.sin(t * 0.1) * 2;

  // Login acceleration
  if (loginTriggered) {
    particleMat.opacity = Math.min(0.9, particleMat.opacity + 0.02);
    shieldGroup.rotation.y += 0.02;
    coreGlow.material.opacity = Math.min(0.5, coreGlow.material.opacity + 0.01);
  }

  renderer.render(scene, camera);
}
animate();

// ── RESIZE ──
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ──────────────────────────────────────────────
// UI INTERACTIONS
// ──────────────────────────────────────────────

// Floating labels
document.querySelectorAll('.form-input').forEach(input => {
  const updateLabel = () => {
    input.classList.toggle('filled', input.value.length > 0);
  };
  input.addEventListener('input', updateLabel);
  input.addEventListener('blur', updateLabel);
});

// Password toggle
const togglePw = document.getElementById('togglePw');
const pwInput = document.getElementById('password');
const eyeIcon = document.getElementById('eyeIcon');

function togglePassword() {
  const isPassword = pwInput.type === 'password';
  pwInput.type = isPassword ? 'text' : 'password';
  eyeIcon.innerHTML = isPassword
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

togglePw.addEventListener('click', togglePassword);
togglePw.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); togglePassword(); } });

// Ripple effect
function addRipple(e, btn) {
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const ripple = document.createElement('span');
  ripple.classList.add('ripple');
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
  btn.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

document.querySelectorAll('.btn-primary, .btn-secondary').forEach(btn => {
  btn.addEventListener('click', e => addRipple(e, btn));
});

// Login form submission
const loginForm = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const btnText = document.getElementById('btnText');
const scanLine = document.getElementById('scanLine');
const successOverlay = document.getElementById('successOverlay');

loginForm.addEventListener('submit', e => {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    // Shake animation
    loginBtn.style.animation = 'none';
    loginBtn.style.transform = 'translateX(0)';
    let shakes = 0;
    const shakeInt = setInterval(() => {
      loginBtn.style.transform = `translateX(${shakes % 2 === 0 ? 6 : -6}px)`;
      if (++shakes >= 6) { clearInterval(shakeInt); loginBtn.style.transform = 'translateX(0)'; }
    }, 60);
    return;
  }

  // Loading state
  loginBtn.classList.add('loading');
  btnText.textContent = 'AUTHENTICATING...';
  loginTriggered = true;

  // Scan line
  setTimeout(() => {
    scanLine.classList.add('active');
    setTimeout(() => scanLine.classList.remove('active'), 1300);
  }, 400);

  // Success
  setTimeout(() => {
    loginBtn.classList.remove('loading');
    successOverlay.classList.add('active');
    loginTriggered = false;
  }, 2200);
});

// Biometric button interaction
document.querySelector('.btn-biometric').addEventListener('click', () => {
  const btn = document.querySelector('.btn-biometric');
  btn.textContent = 'SCANNING BIOMETRICS...';
  btn.style.color = '#00d4ff';
  btn.style.borderColor = 'rgba(0,212,255,0.5)';
  setTimeout(() => {
    btn.innerHTML = '<span style="margin-right:8px">⊕</span>BIOMETRIC ACCESS';
    btn.style.color = '';
    btn.style.borderColor = '';
  }, 2000);
});

// Card parallax on device tilt (mobile)
if (window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', e => {
    const x = (e.gamma || 0) / 45;
    const y = (e.beta ? (e.beta - 45) / 45 : 0);
    mouse.targetX = Math.max(-1, Math.min(1, x));
    mouse.targetY = Math.max(-1, Math.min(1, y));
  });
}
</script>
